# Use alongside compose.vps.yaml after transferring the private JSON to the VPS.
# File secrets are read-only bind mounts; set host ownership root:33 and mode 440.
x-fcm-runtime: &fcm-runtime
  environment:
    FCM_SERVICE_ACCOUNT_JSON: ""
    GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase_service_account
  secrets:
    - firebase_service_account

services:
  app:
    <<: *fcm-runtime
  worker:
    <<: *fcm-runtime

secrets:
  firebase_service_account:
    file: ${FCM_SERVICE_ACCOUNT_FILE:?Set the private JSON host path in .env.vps}
